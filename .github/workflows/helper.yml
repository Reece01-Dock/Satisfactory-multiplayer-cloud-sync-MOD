name: helper

on:
  push:
    paths: ["shared-world-helper/**", ".github/workflows/helper.yml"]
  pull_request:
    paths: ["shared-world-helper/**", ".github/workflows/helper.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: shared-world-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: shared-world-helper/go.mod
      - run: go vet ./...
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: Smoke test (two helper processes)
        if: runner.os == 'Linux'
        run: ./scripts/smoke-two-helpers.sh
      - name: Build Windows helper
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build -o shared-world-helper.exe ./cmd/shared-world-helper
